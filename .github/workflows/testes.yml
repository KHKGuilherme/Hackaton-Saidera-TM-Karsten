name: Testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar testes (inclui o teste golden contra o gabarito oficial)
        run: python -m pytest -v
      - name: Auditar o gabarito oficial pela CLI
        run: python -m autotm --auditar kit_oficial/PO-SL-000.ods
